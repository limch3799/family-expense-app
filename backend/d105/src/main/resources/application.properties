spring.application.name=d105

# Database - Primary
db.primary.url=${DB_PRIMARY_URL}
db.primary.username=${DB_PRIMARY_USERNAME}
db.primary.password=${DB_PRIMARY_PASSWORD}
db.primary.max-pool-size=${DB_PRIMARY_MAX_POOL_SIZE}
db.primary.min-idle=${DB_PRIMARY_MIN_IDLE}
db.primary.connection-timeout=${DB_PRIMARY_CONNECTION_TIMEOUT}
db.primary.idle-timeout=${DB_PRIMARY_IDLE_TIMEOUT}

# Database - Read
db.read.url=${DB_READ_URL}
db.read.username=${DB_READ_USERNAME}
db.read.password=${DB_READ_PASSWORD}
db.read.max-pool-size=${DB_READ_MAX_POOL_SIZE}
db.read.min-idle=${DB_READ_MIN_IDLE}
db.read.connection-timeout=${DB_READ_CONNECTION_TIMEOUT}
db.read.idle-timeout=${DB_READ_IDLE_TIMEOUT}

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database=POSTGRESQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/actuator
management.health.mail.enabled=false

# Swagger
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# Logging
log.path=${LOG_PATH}
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.write-dates-with-zone-id=false
spring.jackson.deserialization.adjust-dates-to-context-time-zone=false
spring.jackson.time-zone=Asia/Seoul